name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: projects/scratch/package-lock.json
      
      - name: Install dependencies
        working-directory: projects/scratch
        run: npm ci
      
      - name: Run tests
        working-directory: projects/scratch
        run: npm test
      
      - name: Run tests with coverage
        working-directory: projects/scratch
        run: npm run test:coverage
      
      - name: Upload coverage reports
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          working-directory: projects/scratch
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
  
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: projects/scratch/package-lock.json
      
      - name: Install dependencies
        working-directory: projects/scratch
        run: npm ci
      
      - name: Run ESLint
        working-directory: projects/scratch
        run: npm run lint
      
      - name: Check code formatting
        working-directory: projects/scratch
        run: npm run format:check
  
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Verify HTML structure
        working-directory: projects/scratch
        run: |
          if [ ! -f "index.html" ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          echo "index.html found ✓"
      
      - name: Verify JavaScript modules
        working-directory: projects/scratch
        run: |
          required_modules="stage-core.js stage-geometry.js stage-physics.js stage-props.js stage-actors.js stage-lighting.js stage-serialization.js stage-main.js"
          for module in $required_modules; do
            if [ ! -f "js/$module" ]; then
              echo "Error: js/$module not found"
              exit 1
            fi
            echo "✓ js/$module"
          done
      
      - name: Check test files
        working-directory: projects/scratch
        run: |
          test_count=$(find __tests__ -name "*.test.js" | wc -l)
          if [ $test_count -lt 4 ]; then
            echo "Error: Expected at least 4 test files, found $test_count"
            exit 1
          fi
          echo "✓ Found $test_count test files"
